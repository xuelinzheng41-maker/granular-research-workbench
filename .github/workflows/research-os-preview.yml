name: Research OS preview

on:
  push:
    branches: [research-os-v2-preview]
  pull_request:
    paths:
      - 'research-os/**'
      - 'requirements-research-os.txt'
      - '.github/workflows/research-os-preview.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research-os.txt
      - run: python -B research-os/cli.py datasets check
      - run: python -B research-os/cli.py datasets for-paper research-os/examples/paper.md --registry research-os/datasets.json
      - run: python -B -m unittest discover -s research-os/tests -v
