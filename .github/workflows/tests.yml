name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt
      - name: Independent skill self-test
        run: python -B -S skills/research-idea/scripts/selftest.py
        env:
          PYTHONUTF8: "1"
      - name: Windows console encoding regression
        if: runner.os == 'Windows'
        run: python -B -S skills/research-idea/scripts/selftest.py
        env:
          PYTHONUTF8: "0"
          PYTHONIOENCODING: "cp936"
      - name: Skill tests
        run: python -B -m unittest discover -s skills/research-idea/tests -v
        env:
          PYTHONUTF8: "1"
      - name: Workbench tests
        run: python -B -m unittest discover -s workbench/tests -v
        env:
          PYTHONUTF8: "1"
      - name: Research memory CLI tests
        run: python -B -m unittest discover -s research-os/tests -p test_research_memory.py -v
        env:
          PYTHONUTF8: "1"
      - name: Fresh-clone test
        run: python -B -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"
